<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icons/pensieve-mark.svg" />
    <!-- .ico fallback for browsers that ignore the SVG icon, and for the
         tab-restore/bookmark paths that read the classic favicon. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <!-- iOS flattens alpha onto white, so this one has the ground baked in. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050A18" />
    <title>pensieve</title>
    <!-- Pensieve brand type: JetBrains Mono (display) + IBM Plex Sans (body).
         Matches the docs site; degrades to the system stack offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
