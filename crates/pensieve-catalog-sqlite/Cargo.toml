[package]
name = "pensieve-catalog-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Embedded SQLite-backed catalog for local single-binary mode. Same Catalog trait as the Postgres catalog; mirrors the Iceberg-style metadata model (table → snapshot → manifest → extent), JSON1 column stats, Rust-side extent pruning, no pgvector."

[lints]
workspace = true

[dependencies]
pensieve-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio.workspace = true
# SQLite backend on top of the workspace sqlx (which already enables postgres);
# sqlx features are additive across the build graph, so this just adds sqlite.
sqlx = { workspace = true, features = ["sqlite"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
arrow-schema.workspace = true
