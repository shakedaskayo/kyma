[package]
name = "kyma-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "kyma — the context engine for coding agents. A single binary: stdio/HTTP MCP, a zero-infra local web UI + API (serve), memory recall/save, and control-plane sync. Installs as `kyma`."
homepage = "https://www.getkyma.dev"
documentation = "https://www.getkyma.dev"
keywords = ["mcp", "memory", "agent", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kyma"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kyma-core.workspace = true
kyma-catalog.workspace = true
# Local-engine commands (mcp/serve/setup/sync) — one `kyma` binary, no separate tool.
kyma-local.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
arrow-schema.workspace = true
sqlx.workspace = true
# clap will be needed for subcommands — adding directly here since only kyma-cli uses it
clap = { version = "4", features = ["derive", "env"] }
reqwest = { workspace = true, features = ["json"] }
futures-util = "0.3"
directories = "5"
# `kyma update` self-update: unpack release tarballs + verify checksums.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
# Hidden interactive password prompts for `kyma user create|passwd`.
rpassword = "7"
# `kyma deploy`: PKCE verifiers + generated passwords.
rand = "0.8"

[dev-dependencies]
wiremock = "0.6"
