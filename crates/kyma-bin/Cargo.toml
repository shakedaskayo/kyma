[package]
name = "kyma-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Main kyma binary. Composes services, registers the node in the catalog, runs background workers."

[[bin]]
name = "kyma"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kyma-core.workspace = true
kyma-catalog.workspace = true
kyma-jobs.workspace = true
kyma-index-vector.workspace = true
kyma-index-fts.workspace = true
hostname = "0.4"
uuid.workspace = true
kyma-storage.workspace = true
kyma-format-tlm.workspace = true
kyma-compaction.workspace = true
kyma-datasources.workspace = true
kyma-ingest-core.workspace = true
kyma-ingest-rest.workspace = true
kyma-ingest-filedrop.workspace = true
kyma-ingest-otlp.workspace = true
kyma-ingest-kafka.workspace = true
kyma-mcp.workspace = true
kyma-memory.workspace = true
kyma-plan.workspace = true
kyma-kql.workspace = true
kyma-exec.workspace = true
kyma-federation.workspace = true
kyma-server.workspace = true
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tokio.workspace = true
anyhow.workspace = true
axum.workspace = true
tonic.workspace = true
tonic-web.workspace = true
opentelemetry-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
chrono.workspace = true

[features]
default = ["github"]
web-ui  = ["kyma-server/web-ui"]
cloud-auth = ["kyma-server/cloud-auth"]
github = ["kyma-datasources/github"]
