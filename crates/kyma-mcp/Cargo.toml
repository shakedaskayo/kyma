[package]
name = "kyma-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JSON-RPC 2.0 Model Context Protocol server over Streamable HTTP."

[lints]
workspace = true

[dependencies]
kyma-server = { workspace = true }
adk-rust = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
kyma-server = { workspace = true, features = ["test-support"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
# DB-free fixtures for the stdio framing test (embedded catalog + in-mem store).
kyma-catalog-sqlite = { workspace = true }
kyma-format-tlm = { workspace = true }
kyma-storage = { workspace = true }
kyma-core = { workspace = true }
