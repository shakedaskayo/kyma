[package]
name = "kyma-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP + gRPC query API, auth stub, health, observability."

[lints]
workspace = true

[dependencies]
kyma-core.workspace = true
kyma-plan.workspace = true
kyma-exec.workspace = true
kyma-kql.workspace = true
kyma-catalog.workspace = true
kyma-connectors.workspace = true
datafusion.workspace = true
arrow.workspace = true
arrow-array.workspace = true
bytes.workspace = true
kyma-web-assets = { path = "../kyma-web-assets", optional = true }
kyma-format-tlm = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
uuid.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic.workspace = true
prost.workspace = true
arrow-flight.workspace = true
tokio-stream = "0.1"
arrow-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
adk-rust.workspace = true
schemars.workspace = true
sqlx.workspace = true
chrono.workspace = true
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
serde_json.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
tower = { workspace = true, features = ["util"] }
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
kyma-catalog.workspace = true

[features]
default = []
cloud-auth = []
web-ui  = ["dep:kyma-web-assets", "dep:tonic-web", "dep:http-body-util"]
test-support = [
    "dep:kyma-format-tlm",
    "dep:object_store",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "dep:reqwest",
]

[[test]]
name = "catalog_http"
required-features = ["test-support"]

[[test]]
name = "flight_web_smoke"
required-features = ["web-ui", "test-support"]

[[test]]
name = "dashboards_http"
required-features = ["test-support"]

[[test]]
name = "cleanup_http"
required-features = ["test-support"]
