[package]
name = "kyma-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local-engine library behind the kyma CLI's mcp/serve/setup/sync commands — embedded SQLite catalog + local-filesystem store + stdio/HTTP MCP, zero infra."

[lints]
workspace = true

[dependencies]
kyma-core.workspace = true
kyma-jobs.workspace = true
kyma-datasources.workspace = true
kyma-compaction.workspace = true
kyma-catalog-sqlite.workspace = true
kyma-ingest-otlp.workspace = true
kyma-storage.workspace = true
kyma-format-tlm.workspace = true
# web-ui embeds the same web interface the hosted server serves.
kyma-server = { workspace = true, features = ["web-ui"] }
kyma-mcp.workspace = true
kyma-memory.workspace = true
kyma-ccmem.workspace = true
kyma-ingest-rest.workspace = true
kyma-ingest-core.workspace = true
tokio.workspace = true
axum.workspace = true
# Node provenance for the local watcher status (same version
# kyma-datasources pins for its node_identity helper).
hostname = "0.4"
reqwest.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
anyhow.workspace = true
async-trait.workspace = true
uuid.workspace = true

[dev-dependencies]
kyma-embed.workspace = true
async-trait.workspace = true
tempfile = "3"
tower.workspace = true
object_store.workspace = true
