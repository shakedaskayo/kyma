[package]
name = "kyma-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "kyma local — the single-binary context engine. Embedded SQLite catalog + local-filesystem store + stdio MCP. Zero infra: no Postgres, no MinIO, no HTTP. Connect any coding agent over stdio."

[[bin]]
name = "kyma-local"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kyma-core.workspace = true
kyma-catalog-sqlite.workspace = true
kyma-storage.workspace = true
kyma-format-tlm.workspace = true
# web-ui embeds the same web interface the hosted server serves.
kyma-server = { workspace = true, features = ["web-ui"] }
kyma-mcp.workspace = true
kyma-memory.workspace = true
kyma-ingest-rest.workspace = true
kyma-ingest-core.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
