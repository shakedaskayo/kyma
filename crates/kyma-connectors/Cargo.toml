[package]
name = "kyma-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "kyma connector framework: scheduled pulls from GitHub/GitLab/Bitbucket/Prometheus and other sources."

[lints]
workspace = true

[dependencies]
kyma-core = { workspace = true }
kyma-catalog = { workspace = true }
kyma-ingest-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true, features = ["chrono-tz"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
fastrand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sqlx = { workspace = true }
object_store = { workspace = true }
base64 = "0.22"
sha2 = "0.10"

# tree-sitter structural code graph deps — only compiled when the `github`
# feature is enabled (they bring in C grammar crates which are slow to build).
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
globset = { version = "0.4", optional = true }

[features]
github = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:globset",
]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
wiremock = "0.6"
