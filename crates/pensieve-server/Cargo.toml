[package]
name = "pensieve-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP + gRPC query API, auth stub, health, observability."

[lints]
workspace = true

[dependencies]
pensieve-core.workspace = true
pensieve-graph.workspace = true
pensieve-graph-topo.workspace = true
anyhow = { workspace = true }
pensieve-plan.workspace = true
pensieve-exec.workspace = true
pensieve-federation.workspace = true
pensieve-kql.workspace = true
pensieve-catalog.workspace = true
pensieve-storage.workspace = true
pensieve-datasources.workspace = true
pensieve-memory.workspace = true
pensieve-artifact-graph.workspace = true
pensieve-embed.workspace = true
pensieve-redact.workspace = true
pensieve-ccmem.workspace = true
pensieve-brain.workspace = true
# Git clients gzip upload-pack negotiation bodies (brain smart-HTTP).
flate2 = "1"
# Local degraded-mode dreaming persists finished runs into the embedded SQLite
# catalog (dreaming_local.rs downcasts the Catalog to SqliteCatalog).
pensieve-catalog-sqlite.workspace = true
pensieve-ingest-core.workspace = true
datafusion.workspace = true
arrow.workspace = true
arrow-array.workspace = true
bytes.workspace = true
pensieve-web-assets = { workspace = true, optional = true }
pensieve-format-tlm = { workspace = true, optional = true }
object_store = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
tonic-web = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
reqwest = { workspace = true }
which = "6"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
uuid.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic.workspace = true
prost.workspace = true
arrow-flight.workspace = true
tokio-stream = "0.1"
async-stream = "0.3"
arrow-schema.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
adk-rust.workspace = true
schemars.workspace = true
sqlx.workspace = true
chrono.workspace = true
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
jsonwebtoken.workspace = true
hex = "0.4"
claude-code-agent-sdk = "0.1.39"
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
serde_json.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
tower = { workspace = true, features = ["util"] }
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true
pensieve-catalog.workspace = true
pensieve-ingest-core.workspace = true
tempfile = "3"
wiremock = "0.6"
# Embedded-engine fixtures for the cc_curate unit tests (no Postgres).
pensieve-format-tlm.workspace = true
pensieve-storage.workspace = true
pensieve-embed.workspace = true
# RSA keypair generation for OidcAuthBackend unit tests.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

[features]
default = []
cloud-auth = []
web-ui  = ["dep:pensieve-web-assets", "dep:tonic-web", "dep:http-body-util"]
test-support = [
    "dep:pensieve-format-tlm",
    "dep:testcontainers",
    "dep:testcontainers-modules",
]

[[test]]
name = "catalog_http"
required-features = ["test-support"]

[[test]]
name = "flight_web_smoke"
required-features = ["web-ui", "test-support"]

[[test]]
name = "dashboards_http"
required-features = ["test-support"]

[[test]]
name = "cleanup_http"
required-features = ["test-support"]

[[test]]
name = "auth_backends_it"
required-features = ["test-support", "cloud-auth"]

[[test]]
name = "auth_catalog_it"
required-features = ["test-support"]

[[test]]
name = "auth_handler_it"
required-features = ["test-support"]

[[test]]
name = "auth_tokens_it"
required-features = ["test-support"]

[[test]]
name = "session_backend_it"
required-features = ["test-support"]

[[test]]
name = "discover_saved_views_it"
required-features = ["test-support"]

[[test]]
name = "oidc_backend_it"
