[package]
name = "pensieve-federation"
description = "Federated (live-proxied) external data sources for pensieve — remote subplan pushdown over DataFusion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
pensieve-core = { workspace = true }

datafusion = { workspace = true }
datafusion-federation = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-json = { workspace = true }

tiberius = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
