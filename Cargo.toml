[workspace]
resolver = "2"
members = [
    "crates/kyma-core",
    "crates/kyma-format-tlm",
    "crates/kyma-format-parquet",
    "crates/kyma-format-stub-vec",
    "crates/kyma-catalog",
    "crates/kyma-catalog-sqlite",
    "crates/kyma-storage",
    "crates/kyma-ingest-core",
    "crates/kyma-ingest-rest",
    "crates/kyma-ingest-filedrop",
    "crates/kyma-ingest-otlp",
    "crates/kyma-ingest-kafka",
    "crates/kyma-compaction",
    "crates/kyma-datasources",
    "crates/kyma-datasource-core",
    "crates/kyma-codeparse",
    "crates/kyma-jobs",
    "crates/kyma-index-vector",
    "crates/kyma-index-fts",
    "crates/kyma-kql",
    "crates/kyma-graph",
    "crates/kyma-plan",
    "crates/kyma-exec",
    "crates/kyma-federation",
    "crates/kyma-server",
    "crates/kyma-cli",
    "crates/kyma-bin",
    "crates/kyma-local",
    "crates/kyma-web-assets",
    "crates/kyma-embed",
    "crates/kyma-memory",
    "crates/kyma-artifact-graph",
    "crates/kyma-mcp",
    "crates/kyma-queue",
    "crates/kyma-redact",
    "crates/kyma-ccmem",
    "crates/kyma-retrieval-eval",
    "crates/kyma-graph-testkit",
    "crates/kyma-graph-bench",
    "crates/kyma-graph-topo",
    "web/src-tauri",
]

[workspace.package]
version = "0.0.22"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/shakedaskayo/kyma"
authors = ["kyma contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# missing_docs tightens back to "warn" in M6 hardening (see plan §9).
# During scaffolding + M1-M5, crate/module-level docs are required but
# per-field docs are noise.
missing_docs = "allow"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
uninlined_format_args = "allow"

[workspace.dependencies]
# Core async + error plumbing
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"

# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }

# Arrow + DataFusion stack — keep these in lockstep; DF 44 depends on arrow 53.x
arrow = "53"
arrow-array = "53"
arrow-schema = "53"
arrow-json = "53"
arrow-flight = "53"
parquet = { version = "53", features = ["arrow", "async", "zstd"] }
datafusion = "44"
# Query federation (remote subplan pushdown). Pinned: 0.3.5 is the last release
# on the DataFusion 44 line (0.3.6+ moved to DF 45/46; 0.4/0.5 need newer still).
# Bump alongside any future DF upgrade.
datafusion-federation = { version = "=0.3.5", features = ["sql"] }
# TDS (SQL Server wire protocol) client — Microsoft Fabric SQL endpoints.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Storage
object_store = { version = "0.11", features = ["aws"] }

# Catalog
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"           # CBOR for `dynamic` column
prost = "0.13"
tonic = "0.12"
tonic-web = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }

# Networking
axum = { version = "0.7", features = ["macros", "http2", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id", "util"] }
hyper = "1"
http-body-util = "0.1"
simd-json = "0.14"

# Parser
chumsky = "0.10"

# Secret detection / redaction
regex = "1"
aho-corasick = "1"

# Indices + compression
fst = "0.4"
zstd = "0.13"
lz4_flex = "0.11"
bytes = "1"

# Ingest sources
rdkafka = { version = "0.37", features = ["cmake-build", "tokio", "tracing"] }
opentelemetry-proto = { version = "0.27", features = ["with-serde", "gen-tonic-messages"] }

# IDs, time, misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Test infra
proptest = "1"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "minio"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

# Metrics (Prometheus via the `metrics` facade crate)
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
fastrand = "2"

# Inter-crate dependencies (always use workspace = true). Each carries a
# `version` alongside `path` so the closure is publishable to crates.io: cargo
# uses the path for workspace builds and the version requirement for published
# crates. Kept in lockstep with [workspace.package] version.
kyma-core              = { path = "crates/kyma-core",            version = "0.0.22" }
kyma-format-tlm        = { path = "crates/kyma-format-tlm",      version = "0.0.22" }
kyma-format-parquet    = { path = "crates/kyma-format-parquet",  version = "0.0.22" }
kyma-format-stub-vec   = { path = "crates/kyma-format-stub-vec", version = "0.0.22" }
kyma-graph-testkit     = { path = "crates/kyma-graph-testkit",   version = "0.0.22" }
kyma-graph-topo        = { path = "crates/kyma-graph-topo",      version = "0.0.22" }
kyma-catalog           = { path = "crates/kyma-catalog",         version = "0.0.22" }
kyma-catalog-sqlite    = { path = "crates/kyma-catalog-sqlite",  version = "0.0.22" }
kyma-local             = { path = "crates/kyma-local",           version = "0.0.22" }
kyma-storage           = { path = "crates/kyma-storage",         version = "0.0.22" }
kyma-ingest-core       = { path = "crates/kyma-ingest-core",     version = "0.0.22" }
kyma-ingest-rest       = { path = "crates/kyma-ingest-rest",     version = "0.0.22" }
kyma-ingest-filedrop   = { path = "crates/kyma-ingest-filedrop", version = "0.0.22" }
kyma-ingest-otlp       = { path = "crates/kyma-ingest-otlp",     version = "0.0.22" }
kyma-ingest-kafka      = { path = "crates/kyma-ingest-kafka",    version = "0.0.22" }
kyma-graph             = { path = "crates/kyma-graph",           version = "0.0.22" }
kyma-kql               = { path = "crates/kyma-kql",             version = "0.0.22" }
kyma-compaction        = { path = "crates/kyma-compaction",      version = "0.0.22" }
kyma-datasources        = { path = "crates/kyma-datasources",      version = "0.0.22" }
kyma-datasource-core    = { path = "crates/kyma-datasource-core",  version = "0.0.22" }
kyma-codeparse         = { path = "crates/kyma-codeparse",       version = "0.0.22" }
kyma-jobs              = { path = "crates/kyma-jobs",            version = "0.0.22" }
kyma-index-vector      = { path = "crates/kyma-index-vector",    version = "0.0.22" }
kyma-index-fts         = { path = "crates/kyma-index-fts",        version = "0.0.22" }
kyma-plan              = { path = "crates/kyma-plan",            version = "0.0.22" }
kyma-exec              = { path = "crates/kyma-exec",            version = "0.0.22" }
kyma-federation        = { path = "crates/kyma-federation",      version = "0.0.22" }
kyma-server            = { path = "crates/kyma-server",          version = "0.0.22" }
kyma-cli               = { path = "crates/kyma-cli",             version = "0.0.22" }
kyma-web-assets        = { path = "crates/kyma-web-assets",      version = "0.0.22" }
kyma-embed             = { path = "crates/kyma-embed",           version = "0.0.22" }
kyma-memory            = { path = "crates/kyma-memory",          version = "0.0.22" }
kyma-artifact-graph    = { path = "crates/kyma-artifact-graph",  version = "0.0.22" }
kyma-mcp               = { path = "crates/kyma-mcp",             version = "0.0.22" }
kyma-queue             = { path = "crates/kyma-queue",           version = "0.0.22" }
kyma-redact            = { path = "crates/kyma-redact",          version = "0.0.22" }
kyma-ccmem             = { path = "crates/kyma-ccmem",           version = "0.0.22" }

# Auth
jsonwebtoken = "9"

# Embeddings + vector search
fastembed = "4"
pgvector = { version = "0.4", features = ["sqlx", "serde"] }
ndarray = "0.16"
schemars = "0.8"

# Agent stack (ADK-Rust) — feature set trimmed to only what the inline
# `/v1/agent/ask` endpoint needs. See crates/kyma-server/src/agent/.
adk-rust = { version = "0.6", default-features = false, features = [
    "agents",
    "models",
    "ollama",
    "anthropic",
    "openai",
    "tools",
    "sessions",
    "runner",
] }

# Vendored arrow-arith patch: upstream 53.4.1 calls `d.quarter()` via the
# `ChronoDateExt` extension trait, which collides with the `Datelike::quarter`
# default method chrono added in 0.4.44. adk-core requires chrono >= 0.4.44,
# and DataFusion 44 is locked to the arrow 53.x line, so neither end can move.
# The patch is a one-line disambiguation (explicit `Datelike::quarter`) plus a
# loosened chrono upper bound in arrow-arith's own manifest. Revisit when
# DataFusion ships a release that tracks an arrow-arith line compatible with
# chrono >= 0.4.44 natively.
[patch.crates-io]
arrow-arith = { path = "third_party/arrow-arith-53-patch" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.bench]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1
debug = true
