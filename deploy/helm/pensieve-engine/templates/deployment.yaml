{{- /* All-in-one Deployment. Disabled when roles.enabled — see roles.yaml. */ -}}
{{- if not .Values.roles.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pensieve-engine.fullname" . }}
  labels:
    {{- include "pensieve-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The engine is single-writer per catalog — never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pensieve-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pensieve-engine.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pensieve-engine.serviceAccountName" . }}
      containers:
        - name: pensieve-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "pensieve-engine.fullname" . }}-env
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
