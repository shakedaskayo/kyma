# kyma-engine default values. `kyma deploy init` renders a values.yaml from the
# wizard answers; these defaults make `helm lint`/`helm template` self-contained.

# The engine is single-writer per catalog — keep one replica.
replicaCount: 1

image:
  repository: ghcr.io/shakedaskayo/kyma-engine
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: ""
  tls: false
  annotations: {}

serviceAccount:
  create: true
  # Must match the IRSA trust on EKS (system:serviceaccount:<ns>:kyma-engine).
  name: kyma-engine
  # On EKS, set eks.amazonaws.com/role-arn here for keyless S3.
  annotations: {}

resources: {}

# Non-secret engine environment (KYMA_* → value). Rendered as container env.
env:
  KYMA_HTTP_ADDR: "0.0.0.0:8080"
  KYMA_GRPC_ADDR: "off"
  KYMA_OTLP_ADDR: "off"

# Secret engine environment (KYMA_CATALOG_URL, KYMA_AUTH_TOKENS, S3 keys, …).
# Rendered into a Kubernetes Secret and injected via envFrom.
secretEnv: {}

# Role split (S2.4/S2.6). Disabled by default → the single all-in-one Deployment
# above. When enabled, three role Deployments run instead (each sets KYMA_ROLE,
# which the engine honors): stateless `edge` nodes (query+ingest, RollingUpdate,
# optional HPA) behind the Service, a single `committer` (Recreate + PDB), and a
# `worker` for background jobs (compaction/index/graph/retention). For the split
# to actually offload commits, set KYMA_INGEST_MODE=staged in `env`.
roles:
  enabled: false
  edge:
    replicas: 2
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  committer:
    pdb: true
  worker:
    replicas: 1
