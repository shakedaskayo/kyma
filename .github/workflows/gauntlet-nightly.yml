name: gauntlet-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  gauntlet:
    name: gauntlet --tier=nightly
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kyma
          POSTGRES_PASSWORD: kyma_dev
          POSTGRES_DB: kyma
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U kyma"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: kyma_admin
          MINIO_ROOT_PASSWORD: kyma_admin_dev
          MINIO_DEFAULT_BUCKETS: kyma
        ports: ["9000:9000"]
    env:
      KYMA_CATALOG_URL: postgresql://kyma:kyma_dev@localhost:5432/kyma
      KYMA_S3_ENDPOINT: http://localhost:9000
      KYMA_S3_BUCKET: kyma
      KYMA_SECRET_KEY: kyma-ci-secret-not-for-production
      KYMA_S3_REGION: us-east-1
      KYMA_S3_ACCESS_KEY_ID: kyma_admin
      KYMA_S3_SECRET_ACCESS_KEY: kyma_admin_dev
      KYMA_S3_PATH_STYLE: "true"
      KYMA_S3_ALLOW_HTTP: "true"
      KYMA_GRPC_ADDR: "off"
      KYMA_OTLP_ADDR: "off"
      AWS_ACCESS_KEY_ID: kyma_admin
      AWS_SECRET_ACCESS_KEY: kyma_admin_dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gauntlet-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: install postgresql client (used by perf scripts)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client cmake pkg-config libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev libzstd-dev protobuf-compiler

      - name: build engine
        run: cargo build --release -p kyma-bin

      - name: start engine
        run: |
          ./target/release/kyma > /tmp/kyma-engine.log 2>&1 &
          echo $! > /tmp/engine.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health || { tail -50 /tmp/kyma-engine.log; exit 1; }

      - name: run gauntlet --tier=nightly
        run: scripts/gauntlet.sh --tier=nightly --results=gauntlet-results.json

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-results-nightly-${{ github.run_id }}
          path: gauntlet-results.json

      - name: dump engine logs on failure
        if: failure()
        run: |
          echo "=== engine log tail ==="
          tail -300 /tmp/kyma-engine.log || true

      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/engine.pid)" 2>/dev/null || true
