name: build-image
#
# GHCR authentication. The `kyma` package is user-scoped (shakedaskayo/kyma)
# and `secrets.GITHUB_TOKEN` only has `write_package` for it once the package
# is linked to this repo via the GitHub UI:
#   https://github.com/users/shakedaskayo/packages/container/kyma/settings
#   → "Manage Actions access" → Add `shakedaskayo/kyma` with Write.
#
# Until that one-click link is done, set a `GHCR_TOKEN` repo secret
# containing a classic PAT (ghp_*) with `write:packages` + `read:packages`,
# and the workflow will fall back to it. We try GHCR_TOKEN first; if it's
# missing the action falls through to GITHUB_TOKEN.
#
# `gho_*` OAuth tokens (what `gh auth token` returns) do NOT work at the
# GHCR registry endpoint from CI. Use a classic ghp_* PAT only.
#
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "web/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer a long-lived PAT in GHCR_TOKEN; fall back to the auto
          # GITHUB_TOKEN (works only once the GHCR package is repo-linked).
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/kyma"
          {
            echo "short_sha=$SHORT_SHA"
            echo "tags=${REPO}:${SHORT_SHA},${REPO}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
