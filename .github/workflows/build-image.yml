name: build-image
#
# One-time setup: the `kyma` GHCR package is user-owned (shakedaskayo/kyma).
# For this workflow's GITHUB_TOKEN to write to it, link the package to this
# repo at https://github.com/users/shakedaskayo/packages/container/kyma/settings
# → "Manage Actions access" → add `shakedaskayo/kyma` with Write permission.
# Without that link, every run fails with `permission_denied: write_package`.
#
# Alternative: set a GHCR_TOKEN secret (PAT with write:packages) and replace
# `${{ secrets.GITHUB_TOKEN }}` below.
#
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "web/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/kyma"
          {
            echo "short_sha=$SHORT_SHA"
            echo "tags=${REPO}:${SHORT_SHA},${REPO}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
