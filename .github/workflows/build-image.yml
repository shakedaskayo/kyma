name: build-image
#
# Publishes the engine image to ghcr.io/shakedaskayo/kyma-engine.
#
# We deliberately use `kyma-engine` (not `kyma`) so this push creates a
# fresh, repo-auto-linked GHCR package on first write. The pre-existing
# `ghcr.io/shakedaskayo/kyma` package was created user-scoped and isn't
# repo-linked, so `secrets.GITHUB_TOKEN` can't write to it; rather than
# require a manual UI click on every fresh repo clone, we ship under a
# new name that the runner's auto token has `packages: write` for.
#
# If you'd rather publish to `ghcr.io/shakedaskayo/kyma`, link the
# package at github.com/users/shakedaskayo/packages/container/kyma/settings
# and rename `kyma-engine` back below.
#
# Tagging scheme:
#   push to main      → :<short_sha> + :edge          (amd64 only, fast feedback)
#   release tag vX.Y.Z → :vX.Y.Z + :latest            (amd64 + arm64; arm64 runs
#                        under QEMU and is slow — acceptable on release cadence)
# `kyma deploy` (deploy/terraform) pins the release tag matching the CLI version.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "crates/**"
      - "web/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 release builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/kyma-engine"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${REPO}:${VERSION},${REPO}:latest"
            PLATFORMS="linux/amd64,linux/arm64"
          else
            TAGS="${REPO}:${SHORT_SHA},${REPO}:edge"
            PLATFORMS="linux/amd64"
          fi
          {
            echo "short_sha=$SHORT_SHA"
            echo "tags=$TAGS"
            echo "platforms=$PLATFORMS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ steps.tags.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
