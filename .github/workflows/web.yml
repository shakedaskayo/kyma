name: web
on:
  pull_request:
    # web now imports the @pensieve-ai/* workspace packages, so changes under
    # packages/ must re-run the web checks too.
    paths: ["web/**", "packages/**", ".github/workflows/web.yml", "pnpm-workspace.yaml"]
  push:
    branches: [main]
    paths: ["web/**", "packages/**", ".github/workflows/web.yml"]
  # e2e is on-demand only (see the job's `if`) — run it from the Actions tab.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # web imports @pensieve-ai/client + @pensieve-ai/react via their built dist/ —
      # build the packages before typechecking/building the app.
      - run: pnpm build:packages
      - run: pnpm -C web typecheck
      - run: pnpm -C web lint
      - run: pnpm -C web test
      - run: pnpm -C web build
  e2e:
    runs-on: ubuntu-latest
    needs: [check]
    # Heavy full-stack Playwright suite (builds the Docker stack). ON-DEMAND
    # only: `playwright install --with-deps` has hung CI runners for the full
    # job timeout (apt prompt), and the stack path is unproven in CI — run it
    # from the Actions tab when working on it. Skipped on push/PR, so it never
    # affects the `web` conclusion.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - env: { DEBIAN_FRONTEND: noninteractive }
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for pensieve (bounded; dump engine logs on timeout)
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/health >/dev/null && { echo "pensieve healthy"; exit 0; }
            sleep 2
          done
          echo "pensieve did not become healthy in ~3m; engine logs:" >&2
          docker compose logs pensieve || true
          exit 1
      - env: { PENSIEVE_E2E_TOKEN: "" }
        run: pnpm -C web e2e
      - if: always()
        run: docker compose logs pensieve > pensieve.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-traces, path: web/test-results }
