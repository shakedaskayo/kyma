name: release-cli
#
# Builds the pensieve CLI binary for macOS (arm64 + x64) and Linux (arm64 + x64),
# then creates (or updates) a GitHub release with the binary artifacts.
#
# Triggered by vX.Y.Z tags only — @pensieve-ai/* npm tags are excluded.
# Artifact naming matches install.sh / pensieve update conventions:
#   pensieve-darwin-arm64.tar.gz, pensieve-darwin-x64.tar.gz
#   pensieve-linux-arm64.tar.gz,  pensieve-linux-x64.tar.gz
#
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  # ── macOS builds (native, no cross-compilation) ─────────────────────────────
  build-macos:
    name: "build (${{ matrix.target }})"
    runs-on: macos-15  # Apple Silicon runner
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: pensieve-darwin-arm64
          - target: x86_64-apple-darwin
            artifact: pensieve-darwin-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Build web UI
        # Root workspace install — web depends on workspace:* packages
        # (@pensieve-ai/client, @pensieve-ai/react) that must be built (dist/) first.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pensieve-ai/client build
          pnpm --filter @pensieve-ai/react build
          pnpm --filter pensieve-web build

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build -p pensieve-cli --release --target ${{ matrix.target }}

      - name: Package
        run: |
          # pensieve-cli's build output is `pensieve-cli`; end users get it as `pensieve`.
          cp target/${{ matrix.target }}/release/pensieve-cli pensieve
          tar czf ${{ matrix.artifact }}.tar.gz pensieve
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  # ── Linux builds (cross-compilation via cross) ───────────────────────────────
  # Native builds on GitHub's x64 + ARM Linux runners — NOT cross-compilation.
  # Cross-compiling failed at link time: the C++ ONNX Runtime (ort/fastembed)
  # and a glibc ≥2.32 symbol (`__libc_single_threaded`) couldn't be satisfied by
  # cross-rs's older sysroot. A native runner has a current glibc + libstdc++ and
  # `ort` fetches a matching prebuilt, so the link resolves. OpenSSL is still
  # vendored (see pensieve-cli/Cargo.toml) for a self-contained binary.
  build-linux:
    name: "build (${{ matrix.target }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: pensieve-linux-x64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            artifact: pensieve-linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Build web UI
        # Root workspace install — web depends on workspace:* packages
        # (@pensieve-ai/client, @pensieve-ai/react) that must be built (dist/) first.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pensieve-ai/client build
          pnpm --filter @pensieve-ai/react build
          pnpm --filter pensieve-web build

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev libzstd-dev protobuf-compiler

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build -p pensieve-cli --release --target ${{ matrix.target }}

      - name: Package
        run: |
          # pensieve-cli's build output is `pensieve-cli`; end users get it as `pensieve`.
          cp target/${{ matrix.target }}/release/pensieve-cli pensieve
          tar czf ${{ matrix.artifact }}.tar.gz pensieve
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  # ── Create / update GitHub release with all artifacts ───────────────────────
  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pensieve-darwin-arm64.tar.gz
            pensieve-darwin-arm64.tar.gz.sha256
            pensieve-darwin-x64.tar.gz
            pensieve-darwin-x64.tar.gz.sha256
            pensieve-linux-arm64.tar.gz
            pensieve-linux-arm64.tar.gz.sha256
            pensieve-linux-x64.tar.gz
            pensieve-linux-x64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
