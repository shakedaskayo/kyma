name: Publish to crates.io

# MANUAL ONLY. Publishes kyma-cli's dependency closure (19 crates) to crates.io
# in dependency-layer order.
#
# ⚠️ Caveat: the workspace pins a `[patch.crates-io] arrow-arith` fix for a
# chrono 0.4.44 / DataFusion 44 conflict. Cargo `[patch]` does NOT propagate to
# published crates, so until that fix lands upstream, a downstream
# `cargo install kyma-cli` may fail to compile. Publishing (with --no-verify)
# still succeeds and reserves the names; the reliable install path remains the
# prebuilt binary (install.sh / GitHub Releases).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing to crates.io'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates (dependency order)
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }

      # kyma-web-assets embeds the built UI from its crate-local `embedded/`
      # dir; populate it (build.rs syncs ../../web/dist) before packaging.
      - name: Build web UI + populate embedded assets
        run: |
          pnpm install --frozen-lockfile
          pnpm -C web build
          cargo build -p kyma-web-assets

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            local crate="$1"
            echo "::group::Publishing $crate"
            local out
            # --no-verify: skip the verification build (the arrow-arith patch is
            #   workspace-local and not needed just to package + upload).
            # --allow-dirty: kyma-web-assets ships the gitignored, generated
            #   embedded/ dir via its `include` list.
            if out=$(cargo publish -p "$crate" --no-verify --allow-dirty 2>&1); then
              echo "$crate published."
            elif echo "$out" | grep -qiE "already (exists|uploaded)|crate version .* is already uploaded"; then
              echo "$crate already at this version — skipping."
            else
              echo "$out"
              echo "::error::Failed to publish $crate"
              exit 1
            fi
            echo "::endgroup::"
            sleep 20   # let the crates.io index catch up before dependents
          }

          # Layer 1 — no internal deps
          publish kyma-core
          publish kyma-graph
          publish kyma-web-assets
          # Layer 2
          publish kyma-catalog
          publish kyma-catalog-sqlite
          publish kyma-embed
          publish kyma-plan
          publish kyma-storage
          # Layer 3
          publish kyma-format-tlm
          publish kyma-kql
          # Layer 4
          publish kyma-exec
          publish kyma-ingest-core
          # Layer 5
          publish kyma-connectors
          publish kyma-ingest-rest
          publish kyma-memory
          # Layer 6
          publish kyma-server
          # Layer 7
          publish kyma-mcp
          # Layer 8
          publish kyma-local
          # Layer 9 — the CLI (installs as `kyma`)
          publish kyma-cli
