name: Publish to crates.io

# MANUAL ONLY. Publishes pensieve-cli's dependency closure to crates.io in
# dependency order, derived at run time by scripts/crates-publish-order.py.
#
# ⚠️ Caveat: the workspace pins a `[patch.crates-io] arrow-arith` fix for a
# chrono 0.4.44 / DataFusion 44 conflict. Cargo `[patch]` does NOT propagate to
# published crates, so until that fix lands upstream, a downstream
# `cargo install pensieve-cli` may fail to compile. Publishing (with --no-verify)
# still succeeds and reserves the names; the reliable install path remains the
# prebuilt binary (install.sh / GitHub Releases).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing to crates.io'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates (dependency order)
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    # 33 crates, every one a new name after the rename, against a crates.io
    # new-crate limit of roughly one per ten minutes once the initial burst is
    # spent. That is hours of mostly waiting, so take the maximum a
    # GitHub-hosted runner allows. Re-running is safe: already-published
    # versions are detected and skipped.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }

      # pensieve-web-assets embeds the built UI from its crate-local `embedded/`
      # dir; populate it (build.rs syncs ../../web/dist) before packaging.
      - name: Build web UI + populate embedded assets
        run: |
          pnpm install --frozen-lockfile
          # web imports @pensieve-ai/client + @pensieve-ai/react through their
          # built dist/, so the workspace packages have to exist first. Without
          # this the web build dies on "Cannot find module '@pensieve-ai/client'"
          # and takes the whole publish with it. release.yml and web.yml have
          # always done this; this workflow was the odd one out.
          pnpm build:packages
          pnpm -C web build
          cargo build -p pensieve-web-assets

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # crates.io rate-limits NEW crate names hard: a small burst, then
          # roughly one every ten minutes. Renaming the project made all 33
          # crates new at once, so a run without backoff dies partway with a
          # 429 — and a publish cannot be rolled back, leaving the registry
          # half-populated. The server tells us exactly when to come back
          # ("Please try again after Wed, 02 Sep 2026 10:18:10 GMT"), so honour
          # that instead of guessing.
          publish() {
            local crate="$1"
            echo "::group::Publishing $crate"
            local out attempt=0
            while :; do
              # --no-verify: skip the verification build (the arrow-arith patch
              #   is workspace-local and not needed just to package + upload).
              # --allow-dirty: pensieve-web-assets ships the gitignored,
              #   generated embedded/ dir via its `include` list.
              if out=$(cargo publish -p "$crate" --no-verify --allow-dirty 2>&1); then
                echo "$crate published."
                break
              elif echo "$out" | grep -qiE "already (exists|uploaded)|crate version .* is already uploaded"; then
                echo "$crate already at this version — skipping."
                break
              elif echo "$out" | grep -q "429 Too Many Requests"; then
                attempt=$((attempt + 1))
                if [ "$attempt" -gt 12 ]; then
                  echo "$out"
                  echo "::error::$crate still rate-limited after $attempt attempts"
                  exit 1
                fi
                local when now wait
                when=$(echo "$out" | sed -n 's/.*try again after \([^.]*\) GMT.*/\1 GMT/p' | head -1)
                now=$(date -u +%s)
                wait=600
                if [ -n "$when" ] && target=$(date -u -d "$when" +%s 2>/dev/null); then
                  wait=$(( target - now + 15 ))
                fi
                [ "$wait" -lt 30 ] && wait=30
                echo "rate-limited on $crate; waiting ${wait}s (attempt $attempt)"
                sleep "$wait"
              else
                echo "$out"
                echo "::error::Failed to publish $crate"
                exit 1
              fi
            done
            echo "::endgroup::"
            sleep 20   # let the crates.io index catch up before dependents
          }

          # The order is DERIVED, not hand-maintained. The previous ladder
          # listed 19 crates; the real closure is 33, and the 14 missing ones
          # included pensieve-graph-topo — so a run died mid-publish, after
          # pensieve-core had already gone to the registry. A partial publish
          # cannot be undone, so this must not be able to drift again.
          scripts/crates-publish-order.py | while read -r crate; do
            publish "$crate"
          done
