name: k8s-smoke

# Validates the SHIPPED HELM CHART path on a throwaway kind cluster: build the
# engine image, then run scripts/fresh-install-validate-k8s.sh — which creates a
# kind cluster, deploys in-cluster Postgres + MinIO, helm-installs the chart from
# the built image, waits for rollout, and asserts health/login/ingest/query/
# search before tearing the cluster down. The k8s analogue of the local and
# docker-compose fresh-install gates.
#
# The image build is expensive, so this runs on push to main + on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  k8s-smoke:
    name: kind + Helm fresh-install smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build engine image
        run: docker build -t pensieve-smoke-pensieve:latest .

      - name: install kind + helm
        run: |
          # /usr/local/bin is root-owned on the runner image. `curl -o` there
          # succeeds via directory permissions but leaves the file owned by
          # root, so the following chmod failed with
          #   chmod: changing permissions of '/usr/local/bin/kind':
          #   Operation not permitted
          # and, under `bash -e`, took the whole job with it before helm or the
          # smoke test ever ran. Download as the runner user, then install with
          # sudo, which sets ownership and mode in one step.
          curl -fsSL -o "$RUNNER_TEMP/kind" \
            https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind --version
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | sudo bash
          helm version --short
          # kubectl is preinstalled on ubuntu-22.04 runners.
          kubectl version --client=true 2>/dev/null | head -1 || true

      - name: k8s fresh-install smoke (kind + helm)
        env:
          PENSIEVE_IMAGE: pensieve-smoke-pensieve:latest
        run: scripts/fresh-install-validate-k8s.sh
