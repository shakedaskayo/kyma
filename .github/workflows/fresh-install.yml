name: fresh-install

# The scale program's acceptance gate (per the user directive): after merging
# tested work to main, prove the engine runs from a *fresh* state with no
# pre-existing data or infra. This exercises the LOCAL single-binary path
# (`kyma serve`: SQLite catalog + local-filesystem store, zero external infra) —
# the same path a new user gets from install.sh / `cargo install`.
#
# Runs scripts/fresh-install-validate.sh, which builds the binary, serves from
# an empty data dir, then asserts health, auth, ingest, query (count/filter/IN),
# unified search, and restart durability. Exits non-zero on the first failure.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fresh-install:
    name: fresh-install (local single-binary path)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Local mode needs no external infra; only a secret key for auth.
      KYMA_SECRET_KEY: kyma-ci-secret-not-for-production
      KYMA_FRESH_PORT: "7799"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fresh-install-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev libzstd-dev protobuf-compiler

      - name: run fresh-install validation
        run: scripts/fresh-install-validate.sh
