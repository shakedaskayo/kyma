name: deploy-plan
#
# Credential-free validation of the self-host deployment stack:
# terraform fmt/validate/tflint on deploy/terraform (init -backend=false →
# no AWS or Supabase secrets needed), plus a typecheck of the Pulumi
# TypeScript example against the SDK generated by the terraform-module
# bridge — so a broken template never ships embedded in the CLI.
on:
  pull_request:
    paths:
      [
        "deploy/**",
        ".tflint.hcl",
        ".github/workflows/deploy-plan.yml",
        "crates/kyma-cli/src/deploy.rs",
      ]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"

      - name: fmt
        run: terraform fmt -check -recursive deploy/terraform

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint
        run: tflint --init && tflint --chdir deploy/terraform --recursive

      - name: init (no backend, no credentials)
        run: terraform -chdir=deploy/terraform init -backend=false

      - name: validate
        run: terraform -chdir=deploy/terraform validate -no-color

  pulumi:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - uses: pulumi/actions@v6
        with:
          pulumi-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        run: npm install --no-fund --no-audit
        working-directory: deploy/pulumi/typescript

      - name: generate SDK from the terraform module
        run: pulumi package add terraform-module ../../terraform/stack kymaengine || true
        working-directory: deploy/pulumi/typescript
        env:
          PULUMI_CONFIG_PASSPHRASE: ""

      # `package add` may fail only at the pnpm link step — link manually,
      # then fail loudly if the SDK itself is missing.
      - name: link generated SDK
        run: |
          test -d sdks/kymaengine || { echo "SDK generation failed"; exit 1; }
          npm pkg set 'dependencies.@pulumi/kymaengine=file:sdks/kymaengine'
          npm install --no-fund --no-audit
        working-directory: deploy/pulumi/typescript

      - name: typecheck
        run: npx tsc --noEmit
        working-directory: deploy/pulumi/typescript
