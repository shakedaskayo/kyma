name: rust-tests

# Correctness gate for the Rust workspace: a full compile of every crate +
# test target, the no-infra unit suites, and the Postgres-backed integration
# suites (testcontainers spins pgvector/pgvector:pg16 per fixture; the pensieve-mcp
# end-to-end pool connects to the `postgres` service below).
#
# Complements gauntlet-pr (live scenario tests against a running engine). There
# is intentionally no `cargo fmt --check` gate — the tree is not rustfmt-clean
# and enforcing it would be a repo-wide reformat, not a correctness signal.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # This job compiles 41 crates plus every test target. With the workspace's
  # `[profile.dev] debug = true` that build is enormous — it exhausted the
  # runner's disk on all 29 preceding runs, failing after ~30 minutes with
  #   rustc-LLVM ERROR: IO failure on output stream: No space left on device
  # Worth being precise, because the size is easy to underestimate: a runner
  # starts with 86 GB free on /, and the build still ran out. line-tables-only
  # keeps file and line numbers in panics and backtraces — what CI actually
  # reads from debuginfo — while dropping the variable and type records that
  # account for most of the bytes. Overridden here rather than in Cargo.toml so
  # local development keeps full debuginfo for stepping in a debugger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Incremental artifacts are pure overhead on a cold CI checkout and add
  # several GB of their own.
  CARGO_INCREMENTAL: "0"
  # The pensieve-mcp end-to-end test opens a raw sqlx pool against this URL (it does
  # not migrate it — assertions run against the testcontainers catalog). Any
  # reachable Postgres satisfies it.
  PENSIEVE_TEST_DATABASE_URL: postgres://pensieve:pensieve_dev@localhost:5432/pensieve

jobs:
  rust-tests:
    name: build + unit + integration
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve_dev
          POSTGRES_DB: pensieve
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pensieve"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      # Reclaim the preinstalled toolchains this job never uses — Android SDK,
      # .NET, GHC, CodeQL, Swift, PowerShell, and the Docker image cache.
      # Measured on this workflow: 86 GB free before, 108 GB after, so ~22 GB
      # for about a minute of work. Together with the debuginfo setting above
      # this is the difference between the job finishing and dying partway
      # through linking.
      - name: Free runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-tests-${{ runner.os }}-

      # Compile gate for the workspace, including every test target — this is
      # what catches "a refactor changed a signature but a test crate was never
      # recompiled" breaks (the engine + server + mcp + catalog crates all build
      # here). Three crates are excluded: they need heavy system libs the bare
      # runner lacks, and their full build is gated by other workflows:
      #   - `app` — the Tauri desktop shell (GTK/webkit); the web frontend has
      #     its own workflow.
      #   - `pensieve-bin` + `pensieve-ingest-kafka` — pull rdkafka/librdkafka, whose
      #     CMake build needs libcurl/SASL/etc. `pensieve-bin`'s full build is
      #     already gated by gauntlet-pr and build-image.
      - name: compile crates + test targets (engine/server surface)
        run: >-
          cargo test --workspace --locked --no-run
          --exclude app --exclude pensieve-bin --exclude pensieve-ingest-kafka

      # Fast, no external dependencies.
      - name: unit suites (no infra)
        run: >-
          cargo test --locked
          -p pensieve-core -p pensieve-storage -p pensieve-kql
          -p pensieve-memory -p pensieve-catalog-sqlite

      # Postgres-backed. testcontainers starts an ephemeral pgvector/pgvector:pg16
      # per fixture using the runner's Docker daemon — no service wiring needed.
      - name: catalog integration (testcontainers)
        run: cargo test --locked -p pensieve-catalog

      - name: server integration (testcontainers)
        run: cargo test --locked -p pensieve-server --features "test-support cloud-auth"

      - name: mcp integration (testcontainers + pool)
        run: cargo test --locked -p pensieve-mcp --features "pensieve-server/test-support"
