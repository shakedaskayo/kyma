name: gauntlet-weekly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  gauntlet:
    name: gauntlet --tier=weekly
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve_dev
          POSTGRES_DB: pensieve
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pensieve"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: pensieve_admin
          MINIO_ROOT_PASSWORD: pensieve_admin_dev
          MINIO_DEFAULT_BUCKETS: pensieve
        ports: ["9000:9000"]
    env:
      PENSIEVE_CATALOG_URL: postgresql://pensieve:pensieve_dev@localhost:5432/pensieve
      PENSIEVE_S3_ENDPOINT: http://localhost:9000
      PENSIEVE_S3_BUCKET: pensieve
      PENSIEVE_SECRET_KEY: pensieve-ci-secret-not-for-production
      PENSIEVE_S3_REGION: us-east-1
      PENSIEVE_S3_ACCESS_KEY_ID: pensieve_admin
      PENSIEVE_S3_SECRET_ACCESS_KEY: pensieve_admin_dev
      PENSIEVE_S3_PATH_STYLE: "true"
      PENSIEVE_S3_ALLOW_HTTP: "true"
      PENSIEVE_GRPC_ADDR: "off"
      PENSIEVE_OTLP_ADDR: "off"
      AWS_ACCESS_KEY_ID: pensieve_admin
      AWS_SECRET_ACCESS_KEY: pensieve_admin_dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gauntlet-weekly-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: install postgresql client (used by perf scripts)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client cmake pkg-config libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev libzstd-dev protobuf-compiler

      - name: build engine
        run: cargo build --release -p pensieve-bin -p pensieve-cli

      - name: start engine
        run: |
          ./target/release/pensieve > /tmp/pensieve-engine.log 2>&1 &
          echo $! > /tmp/engine.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health || { tail -50 /tmp/pensieve-engine.log; exit 1; }

      - name: run gauntlet --tier=weekly
        run: scripts/gauntlet.sh --tier=weekly --results=gauntlet-results.json

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-results-weekly-${{ github.run_id }}
          path: gauntlet-results.json

      - name: dump engine logs on failure
        if: failure()
        run: |
          echo "=== engine log tail ==="
          tail -500 /tmp/pensieve-engine.log || true

      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/engine.pid)" 2>/dev/null || true
