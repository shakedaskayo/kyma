name: npm release

# Changesets release automation for @pensieve-ai/* packages.
# On every push to main:
#   - If there are pending changesets: opens/updates a version-bump PR
#     titled "chore: release @pensieve-ai packages".
#   - If the version-bump PR is merged: publishes to npm.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can diff across commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Test packages
        run: pnpm test:packages

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: release @pensieve-ai packages"
          commit: "chore: release @pensieve-ai packages"
          # npm + CHANGELOG.md are the record for SDK versions. GitHub releases
          # for @pensieve-ai/* tags would steal the repo's "latest" release slot
          # from CLI releases (vX.Y.Z), breaking install.sh's prebuilt-binary
          # resolution and forcing every install into a source build.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with npm provenance (uses the id-token permission above).
          NPM_CONFIG_PROVENANCE: "true"
