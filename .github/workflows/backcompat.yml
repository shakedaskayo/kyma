name: backcompat

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  replay:
    name: replay fixed query set against every fixture
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyma
          POSTGRES_PASSWORD: kyma_dev
          POSTGRES_DB: kyma
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U kyma"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: kyma_admin
          MINIO_ROOT_PASSWORD: kyma_admin_dev
          MINIO_DEFAULT_BUCKETS: kyma
        ports: ["9000:9000"]
    env:
      # Env var names match what crates/kyma-bin/src/main.rs + crates/kyma-storage/src/lib.rs
      # actually read. Verified against source: KYMA_CATALOG_URL, KYMA_S3_ACCESS_KEY_ID,
      # KYMA_S3_SECRET_ACCESS_KEY (not the shorter forms used in some docs).
      KYMA_CATALOG_URL: postgresql://kyma:kyma_dev@localhost:5432/kyma
      KYMA_S3_ENDPOINT: http://localhost:9000
      KYMA_S3_BUCKET: kyma
      KYMA_S3_REGION: us-east-1
      KYMA_S3_ACCESS_KEY_ID: kyma_admin
      KYMA_S3_SECRET_ACCESS_KEY: kyma_admin_dev
      KYMA_S3_PATH_STYLE: "true"
      KYMA_S3_ALLOW_HTTP: "true"
      KYMA_GRPC_ADDR: "off"
      KYMA_OTLP_ADDR: "off"
      # AWS SDK fallback credentials (some object-store libs read these).
      AWS_ACCESS_KEY_ID: kyma_admin
      AWS_SECRET_ACCESS_KEY: kyma_admin_dev
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: backcompat-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: install postgresql client (for pg_dump used by scripts)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: build engine
        run: cargo build --release -p kyma-bin

      - name: start engine
        run: |
          ./target/release/kyma > /tmp/kyma-engine.log 2>&1 &
          echo $! > /tmp/engine.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health || { tail -50 /tmp/kyma-engine.log; exit 1; }

      - name: seed engine with each fixture's seed dataset
        run: |
          for fixture in scripts/fixtures/backcompat/*/; do
            seed="$fixture/seed.ndjson"
            if [ -f "$seed" ]; then
              echo "seeding from $seed"
              curl -fsS -X POST http://localhost:8080/v1/ingest \
                -H "X-Database: obs" \
                -H "X-Table: otel_logs" \
                -H "Content-Type: application/x-ndjson" \
                --data-binary "@$seed"
            fi
          done
          # allow commit coordinator to flush
          sleep 3
          # warm Prometheus metric labels by running each query class once
          # (per F1.16 finding: metric label set initializes on first use)
          curl -sS -X POST http://localhost:8080/v1/query -H "X-Database: obs" -H "Content-Type: application/x-kql" --data-binary 'otel_logs | summarize n = count()' >/dev/null
          curl -sS -X POST http://localhost:8080/v1/query -H "X-Database: obs" -H "Content-Type: application/sql" --data-binary 'SELECT 1' >/dev/null

      - name: replay each fixture
        run: |
          fail=0
          for fixture in scripts/fixtures/backcompat/*/; do
            echo "::group::$(basename "$fixture")"
            if ! scripts/backcompat-replay.sh http://localhost:8080 "$fixture" scripts/backcompat-queries.txt; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: dump engine logs on failure
        if: failure()
        run: |
          echo "=== engine stdout/stderr (tail 200) ==="
          tail -200 /tmp/kyma-engine.log

      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/engine.pid)" 2>/dev/null || true
