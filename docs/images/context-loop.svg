<rect width="1200" height="560" fill="#0e1217"/>
<ellipse cx="600.0" cy="300" rx="300" ry="220" fill="url(#glow)"/>
<text x="600.0" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">The <tspan fill="url(#brand)">context loop</tspan>.</text>
<text x="600.0" y="70" text-anchor="middle" font-size="13" fill="#8da2b6">Sessions and your stack feed the graph — the graph feeds every next prompt, automatically.</text>
