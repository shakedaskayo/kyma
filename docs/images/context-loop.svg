<circle cx="862" cy="268" r="3" fill="#38bdf8"/><text x="876" y="272" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">GitHub · Datadog · K8s · Postgres</text><circle cx="862" cy="298" r="3" fill="#38bdf8"/><text x="876" y="302" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Slack · Jira · Notion · S3 · …</text><circle cx="862" cy="328" r="3" fill="#38bdf8"/><text x="876" y="332" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Logs, traces, metrics, deploys</text>
<path d="M 370 240 C 410 200 430 190 470 190" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrT)"/>
<text x="452" y="166" text-anchor="end" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#2dd4bf">save ▸ remember · ingest_entity · distill</text>
<path d="M 470 415 C 430 415 410 400 372 372" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
<text x="240" y="452" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#38bdf8">recall ▸ memory_search · graph_traverse · run_kql</text>
<text x="240" y="470" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#5d6f80">→ injected into the next prompt, automatically</text>
