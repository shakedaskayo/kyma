<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="pensieve context loop — sessions and your stack feed the graph; the graph feeds every next prompt">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/><stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.05"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="kmCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0d1015"/><stop offset="80%" stop-color="#0d1015"/><stop offset="100%" stop-color="#11151b"/></radialGradient>
<linearGradient id="kmRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="60%" stop-color="#4C8DFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#4C8DFF" stop-opacity="0.15"/></linearGradient>
