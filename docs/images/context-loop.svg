<circle cx="48" cy="48" r="36" fill="url(#kmCore)" stroke="#2a2e36" stroke-width="1"/>
<g stroke="#e8e6e0" stroke-width="3.5" stroke-linecap="round" fill="none"><line x1="34" y1="32" x2="34" y2="64"/><line x1="34" y1="48" x2="58" y2="34"/><line x1="34" y1="48" x2="58" y2="62"/></g>
<circle cx="58" cy="34" r="2.5" fill="#4C8DFF"/><circle cx="58" cy="62" r="2.5" fill="#4C8DFF"/></g>
<text x="600.0" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="url(#brand)">pensieve</text>
<text x="600.0" y="257" text-anchor="middle" font-size="10.5" letter-spacing="1.5" fill="#8da2b6">MEMORY + KNOWLEDGE GRAPH</text>
<line x1="494" y1="272" x2="706" y2="272" stroke="#243140"/>
<circle cx="504" cy="294" r="3" fill="#2dd4bf"/><text x="518" y="298" font-size="12.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Typed entities — k8s · aws · github</text><circle cx="504" cy="320" r="3" fill="#2dd4bf"/><text x="518" y="324" font-size="12.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Durable memories — facts · decisions</text><circle cx="504" cy="346" r="3" fill="#2dd4bf"/><text x="518" y="350" font-size="12.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Live data — logs · traces · KQL</text><circle cx="504" cy="372" r="3" fill="#2dd4bf"/><text x="518" y="376" font-size="12.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Relationships across all of it</text>
<text x="600.0" y="442" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#5d6f80">vendor icons · provider::resource types</text>
