<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-label="kyma agent query lifecycle with three-level pruning">
  <defs>
    <marker id="qArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="qArrGhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .title    { font: 700 15px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 12px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
    .agentQ   { font: 500 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; font-style: italic; }
    .code     { font: 500 12.5px ui-monospace, SFMono-Regular, monospace; fill: #1e293b; }
    .stepNum  { font: 800 14px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #2563eb; }
    .stepName { font: 700 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .stepSub  { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #64748b; }
    .metric   { font: 700 13px ui-monospace, SFMono-Regular, monospace; fill: #0891b2; letter-spacing: 0.3px; }
    .reduction{ font: 700 11px ui-monospace, SFMono-Regular, monospace; fill: #059669; }
    .answerH  { font: 700 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
    .answerB  { font: 400 12px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #334155; }
    .timing   { font: 800 14px ui-monospace, SFMono-Regular, monospace; fill: #059669; }
    .box      { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .askBox   { fill: #ffffff; stroke: #2563eb; stroke-width: 1.8; }
    .codeBox  { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; }
    .stepBox  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
    .stepBand { fill: #eff6ff; stroke: none; }
    .answerBox{ fill: #ffffff; stroke: #059669; stroke-width: 1.8; }
    .flow     { stroke: #2563eb; stroke-width: 1.6; fill: none; }
    .ghost    { stroke: #94a3b8; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    @media (prefers-color-scheme: dark) {
      .title     { fill: #f1f5f9; }
      .subtitle  { fill: #94a3b8; }
      .agentQ    { fill: #f1f5f9; }
      .code      { fill: #e2e8f0; }
      .stepNum   { fill: #60a5fa; }
      .stepName  { fill: #f1f5f9; }
      .stepSub   { fill: #94a3b8; }
      .metric    { fill: #22d3ee; }
      .reduction { fill: #34d399; }
      .answerH   { fill: #f1f5f9; }
      .answerB   { fill: #cbd5e1; }
      .timing    { fill: #34d399; }
      .box       { fill: #0b1220; stroke: #64748b; }
      .askBox    { fill: #0b1220; stroke: #60a5fa; }
      .codeBox   { fill: #0f172a; stroke: #334155; }
      .stepBox   { fill: #0b1220; stroke: #60a5fa; }
      .stepBand  { fill: #0f172a; }
      .answerBox { fill: #0b1220; stroke: #34d399; }
      .ghost     { stroke: #475569; }
    }
  </style>

  <text x="410" y="26" class="title"    text-anchor="middle">one agent question, end-to-end</text>
  <text x="410" y="46" class="subtitle" text-anchor="middle">15,200 extents · 2.3 M candidate rows · 412 ms to answer</text>

  <!-- Agent question -->
  <rect x="60" y="70" width="700" height="56" rx="8" class="askBox"/>
  <text x="80" y="94"  class="stepSub">AGENT · SRE oncall</text>
  <text x="80" y="115" class="agentQ">"What slowed down payments-svc right after the 14:17 deploy? Top-3 span causes."</text>

  <path d="M410,126 L 410,142" class="flow" marker-end="url(#qArr)"/>

  <!-- KQL code block -->
  <rect x="60" y="148" width="700" height="130" rx="8" class="codeBox"/>
  <text x="80" y="170" class="stepSub">KQL emitted by the agent</text>
  <g class="code">
    <text x="80" y="192">otel_traces</text>
    <text x="80" y="210">| where service.name == "payments-svc"</text>
    <text x="80" y="228">| where timestamp between (datetime(2026-04-20 14:15) .. datetime(2026-04-20 14:25))</text>
    <text x="80" y="246">| where span_name startswith "http" or span_name startswith "db"</text>
    <text x="80" y="264">| summarize avg_ms = avg(duration_ms), max_ms = max(duration_ms), n = count() by span_name</text>
  </g>

  <path d="M410,278 L 410,296" class="flow" marker-end="url(#qArr)"/>

  <!-- Pruning cascade -->
  <rect x="60" y="302" width="700" height="280" rx="10" class="stepBand"/>
  <text x="410" y="324" class="stepSub" text-anchor="middle">3-LEVEL PRUNING CASCADE</text>

  <!-- Step 1 -->
  <g>
    <rect x="80" y="338" width="660" height="52" rx="6" class="stepBox"/>
    <text x="98"  y="360" class="stepNum">1</text>
    <text x="120" y="360" class="stepName">Catalog prune</text>
    <text x="120" y="378" class="stepSub">time-range + service.name equality against manifest stats (Postgres)</text>
    <text x="550" y="360" class="metric" text-anchor="start">15,200  →  24 extents</text>
    <text x="740" y="378" class="reduction" text-anchor="end">−99.84 %</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="80" y="398" width="660" height="52" rx="6" class="stepBox"/>
    <text x="98"  y="420" class="stepNum">2</text>
    <text x="120" y="420" class="stepName">Extent footer prune</text>
    <text x="120" y="438" class="stepSub">per-column min/max, equality set, token index, path bitmap (range-GET)</text>
    <text x="550" y="420" class="metric" text-anchor="start">24  →  8 extents</text>
    <text x="740" y="438" class="reduction" text-anchor="end">−66.7 %</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="80" y="458" width="660" height="52" rx="6" class="stepBox"/>
    <text x="98"  y="480" class="stepNum">3</text>
    <text x="120" y="480" class="stepName">Block &amp; index prune</text>
    <text x="120" y="498" class="stepSub">per-block footer + posting list for text predicates</text>
    <text x="550" y="480" class="metric" text-anchor="start">120  →  14 blocks</text>
    <text x="740" y="498" class="reduction" text-anchor="end">−88.3 %</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="80" y="518" width="660" height="52" rx="6" class="stepBox"/>
    <text x="98"  y="540" class="stepNum">4</text>
    <text x="120" y="540" class="stepName">DataFusion exec</text>
    <text x="120" y="558" class="stepSub">vectorized decode + aggregate on Arrow RecordBatches</text>
    <text x="550" y="540" class="metric" text-anchor="start">2.3 M  →  38 rows</text>
    <text x="740" y="558" class="reduction" text-anchor="end">aggregated</text>
  </g>

  <path d="M410,582 L 410,600" class="flow" marker-end="url(#qArr)"/>

  <!-- Answer card -->
  <rect x="60" y="606" width="700" height="130" rx="8" class="answerBox"/>
  <text x="80"  y="630" class="answerH">Streamed back over Arrow Flight</text>
  <text x="720" y="630" class="timing" text-anchor="end">412 ms</text>
  <g class="answerB">
    <text x="80" y="654">1.  db.query.users.lookup         avg 184 ms · max 2.1 s · n=412     ← regressed</text>
    <text x="80" y="674">2.  http.client.auth-svc.verify    avg  92 ms · max 1.4 s · n=2,107  ← regressed</text>
    <text x="80" y="694">3.  db.query.invoices.insert       avg  61 ms · max   820 ms · n=380    ← stable</text>
  </g>
  <text x="80"  y="724" class="stepSub">38 rows · 2 columns · zero-copy Arrow → agent picks next exploratory query.</text>
</svg>
