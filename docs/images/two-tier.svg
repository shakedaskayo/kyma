<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="kyma two tiers — local binary and control plane, one coherent memory via sync">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/><stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.05"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="kmCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0d1015"/><stop offset="80%" stop-color="#0d1015"/><stop offset="100%" stop-color="#11151b"/></radialGradient>
<linearGradient id="kmRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ed957"/><stop offset="60%" stop-color="#7ed957" stop-opacity="0.5"/><stop offset="100%" stop-color="#7ed957" stop-opacity="0.15"/></linearGradient>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2dd4bf"/></marker>
<marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#38bdf8"/></marker>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="470" fill="#0e1217"/>
<ellipse cx="600.0" cy="230" rx="320" ry="180" fill="url(#glow)"/>
<text x="600.0" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">Two tiers. <tspan fill="url(#brand)">One coherent memory.</tspan></text>
<text x="600.0" y="70" text-anchor="middle" font-size="13" fill="#8da2b6">The same context engine — a single local binary per developer, a control plane for the team.</text>
<rect x="60" y="108" width="440" height="280" rx="16" fill="#141b24" stroke="#243140"/><rect x="60" y="108" width="440" height="46" rx="16" fill="#2dd4bf" opacity="0.10"/><text x="82" y="137" font-size="15.5" font-weight="700" fill="#e6edf3">kyma — local mode</text><text x="478" y="137" text-anchor="end" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#2dd4bf">single binary · zero infra</text>
<circle cx="92" cy="176" r="3" fill="#2dd4bf"/><text x="106" y="180" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Embedded SQLite catalog + local files</text><circle cx="92" cy="210" r="3" fill="#2dd4bf"/><text x="106" y="214" font-size="11.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#e6edf3">kyma mcp — stdio for any agent</text><circle cx="92" cy="244" r="3" fill="#2dd4bf"/><text x="106" y="248" font-size="11.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#e6edf3">kyma serve — web UI + full HTTP API</text><circle cx="92" cy="278" r="3" fill="#2dd4bf"/><text x="106" y="282" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">On-demand ingest, KQL/SQL, graph, memory</text><circle cx="92" cy="312" r="3" fill="#2dd4bf"/><text x="106" y="316" font-size="11.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#e6edf3">Claude Code · Cursor · Windsurf · any MCP</text>
<rect x="700" y="108" width="440" height="280" rx="16" fill="#141b24" stroke="#243140"/><rect x="700" y="108" width="440" height="46" rx="16" fill="#38bdf8" opacity="0.10"/><text x="722" y="137" font-size="15.5" font-weight="700" fill="#e6edf3">kyma server — control plane</text><text x="1118" y="137" text-anchor="end" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" fill="#38bdf8">team · always-on</text>
<circle cx="732" cy="176" r="3" fill="#38bdf8"/><text x="746" y="180" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Postgres + object store (S3 / MinIO)</text><circle cx="732" cy="210" r="3" fill="#38bdf8"/><text x="746" y="214" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Scheduled data sources — GitHub · Datadog · Slack · …</text><circle cx="732" cy="244" r="3" fill="#38bdf8"/><text x="746" y="248" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Background consolidation (“dreaming”)</text><circle cx="732" cy="278" r="3" fill="#38bdf8"/><text x="746" y="282" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Team web UI — graph · memory · discover · agent</text><circle cx="732" cy="312" r="3" fill="#38bdf8"/><text x="746" y="316" font-size="13" font-family="IBM Plex Sans, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e6edf3">Auth, users, shared realms</text>
<path d="M 500 215 C 560 215 640 215 700 215" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrT)"/>
<path d="M 700 285 C 640 285 560 285 500 285" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>
<rect x="540" y="232" width="120" height="36" rx="18" fill="#101822" stroke="#2dd4bf" stroke-opacity="0.5"/>
<text x="600" y="255" text-anchor="middle" font-size="13" font-family="JetBrains Mono, ui-monospace, monospace" fill="url(#brand)">kyma sync</text>
<text x="600" y="206" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#5d6f80">push</text>
<text x="600" y="302" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono, ui-monospace, monospace" fill="#5d6f80">pull</text>
<text x="600.0" y="436" text-anchor="middle" font-size="12.5" fill="#8da2b6">Memory stays coherent across your machines and your team — incremental push + pull, conflict-aware.</text>
</svg>